services:
  nginx:
    ports: !reset []
    environment:
      FORWARDED_HEADERS_MODE: trusted-single-proxy
    networks: [app, proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-proxy}
      traefik.http.routers.omnistudio.rule: Host(`${APP_HOST:?Set APP_HOST for the Traefik router}`)
      traefik.http.routers.omnistudio.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.omnistudio.tls: "true"
      traefik.http.routers.omnistudio.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.routers.omnistudio.middlewares: omnistudio-security-headers
      traefik.http.middlewares.omnistudio-security-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.omnistudio-security-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.omnistudio-security-headers.headers.frameDeny: "true"
      traefik.http.services.omnistudio.loadbalancer.server.port: "80"
  api:
    environment:
      FORWARDED_HEADERS_MODE: trusted-single-proxy

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
